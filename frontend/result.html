<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Prediction Result | ChurnPredict</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- ================================
         NAVIGATION
    ================================= -->

    <header class="navbar">

        <div class="logo">
            ChurnPredict
        </div>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="prediction.html">
                Prediction
            </a>

            <a href="about.html">
                About
            </a>

        </nav>

    </header>



    <!-- ================================
         RESULT SECTION
    ================================= -->

    <main class="result-page">

        <div class="result-card">


            <!-- STATUS ICON -->

            <div
                id="resultIcon"
                class="result-icon"
            >
                🔍
            </div>


            <!-- TITLE -->

            <p class="badge">
                AI PREDICTION RESULT
            </p>


            <h1 id="resultTitle">
                Analyzing Customer...
            </h1>


            <!-- RESULT DESCRIPTION -->

            <p
                id="resultDescription"
                class="result-description"
            >
                Your customer's information has been
                analyzed by the machine learning model.
            </p>


            <!-- RISK -->

            <div class="risk-container">

                <span>
                    Risk Level
                </span>

                <strong id="riskLevel">
                    --
                </strong>

            </div>


            <!-- PROBABILITY -->

            <div class="probability-container">

                <div class="probability-header">

                    <span>
                        Churn Probability
                    </span>

                    <strong id="probabilityValue">
                        0%
                    </strong>

                </div>


                <div class="progress-bar">

                    <div
                        id="probabilityBar"
                        class="progress-fill"
                    ></div>

                </div>

            </div>


            <!-- MODEL RESULT -->

            <div class="prediction-details">

                <div class="detail-box">

                    <span>
                        Prediction
                    </span>

                    <strong id="predictionValue">
                        --
                    </strong>

                </div>


                <div class="detail-box">

                    <span>
                        Risk
                    </span>

                    <strong id="riskValue">
                        --
                    </strong>

                </div>

            </div>


            <!-- ACTION BUTTONS -->

            <div class="result-actions">

                <a
                    href="prediction.html"
                    class="btn primary-btn"
                >
                    🔄 New Prediction
                </a>


                <a
                    href="index.html"
                    class="btn secondary-btn"
                >
                    🏠 Back Home
                </a>

            </div>


        </div>

    </main>



    <!-- ================================
         FOOTER
    ================================= -->

    <footer>

        <p>
            © 2026 Telecom Churn Prediction System
        </p>

    </footer>



    <!-- JAVASCRIPT -->

    <script src="js/script.js"></script>


</body>

</html>
